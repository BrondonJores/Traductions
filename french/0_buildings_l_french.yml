    combat_unit_type_infantry_1_desc:0 "Hardened foot soldiers trained for static warfare, excelling in defense and attrition tactics."
    combat_unit_type_infantry_2_desc:0 "Lightly equipped units capable of rapid deployment and flexible maneuvering across varied terrain."
    combat_unit_type_infantry_3_desc:0 "Troops supported by armored transports, combining mobility with increased battlefield resilience."
    combat_unit_type_infantry_4_desc:0 "Heavily armored units integrating infantry and tanks for breakthrough operations and sustained assaults."
    combat_unit_type_infantry_5_desc:0 "A balanced force blending infantry, armor, artillery, and support elements for strategic versatility."
    combat_unit_type_infantry_6_desc:0 "Modular combat formation optimized for autonomous operations, integrating firepower and mobility."
    combat_unit_type_infantry_7_desc:0 "Elite mechanised units equipped with cutting-edge armor and battlefield AI coordination systems."
    combat_unit_type_infantry_8_desc:0 "Next-generation armored force with enhanced survivability, firepower, and integrated drone support."
    combat_unit_type_infantry_9_desc:0 "A future-ready force capable of multi-domain operations and seamless inter-unit coordination."
    combat_unit_type_infantry_10_desc:0 "Experimental combat units piloting mechanized exosuits, redefining mobility, firepower, and tactical dominance."
    combat_unit_type_tanks_1_desc:0 "World War 1 Tanks"
    combat_unit_type_tanks_2_desc:0 "World War 2 Tanks"
