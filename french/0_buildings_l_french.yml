    mobilization_option_special_forces:0 "Special Forces"
    mobilization_option_special_forces_desc:0 "Specially train some servicemen to conduct military operations that are different from the usual ones."
    mobilization_option_cyber_forces:0 "Cyber Warfare Forces"
    mobilization_option_cyber_forces_desc:0 "Form a military unit dedicated to protecting and attacking critical IT infrastructure."
    mobilization_option_cryptography_recon:0 "Decryption Systems"
    mobilization_option_cryptography_recon_desc:0 "Form a military unit dedicated to decoding enemy transmissions."
    mobilization_option_digital_cryptography_recon:0 "Digital Warfare Systems"
    mobilization_option_digital_cryptography_recon_desc:0 "The military shall use the latest computers and software for its combat operations."
    mobilization_option_satellite_recon:0 "Satellite Reconnaissance"
    mobilization_option_satellite_recon_desc:0 "Launch satellites equipped with cameras to spy on our enemies."
    mobilization_option_drones:0 "Combat Drones"
    mobilization_option_drones_desc:0 "A combat drone is an unmanned aerial vehicle (UAV) that is used for intelligence, surveillance, target acquisition, and reconnaissance and carries aircraft ordnance such as missiles, anti-tank guided missiles (ATGMs), and/or bombs in hardpoints for drone strikes."
    mobilization_option_military_indoctrination:0 "Military Indoctrination"
    mobilization_option_military_indoctrination_desc:0 "Soldiers will be indoctrinated to remove characteristics that are detrimental to military life (that is, to subordinate self-interest to follow orders), to train individuals to kill when necessary, and to enable recruits to view themselves in collective terms."
    mobilization_option_political_commissars:0 "Anti-Retreat Forces"
    mobilization_option_political_commissars_desc:0 "Anti-retreat forces are military units that are located in the rear or on the front line (behind the main forces) to maintain military discipline, prevent the flight of servicemen from the battlefield, capture spies, saboteurs and deserters, and return troops who flee from the battlefield or lag behind their units.."
