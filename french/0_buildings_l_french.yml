    combat_unit_type_artillery_1_desc:0 "Traditional gun crews delivering indirect fire support from entrenched positions, ideal for sustained bombardment."
    combat_unit_type_artillery_2_desc:0 "Heavy-caliber emplacements designed to breach fortifications and devastate hardened targets over long sieges."
    combat_unit_type_artillery_3_desc:0 "Mobile fire platforms combining armor and artillery, capable of rapid repositioning and responsive support."
    combat_unit_type_artillery_4_desc:0 "Heavily armored artillery units with enhanced protection and firepower for frontline engagements."
    combat_unit_type_artillery_5_desc:0 "Multi-launch rocket systems delivering saturation fire across wide areas, ideal for suppressing enemy formations."
    combat_unit_type_artillery_6_desc:0 "High-mobility precision rocket systems optimized for fast deployment and long-range tactical strikes."
    combat_unit_type_artillery_7_desc:0 "Advanced launch platforms capable of deploying air-launched ballistic missiles for strategic deep strikes."
    combat_unit_type_artillery_8_desc:0 "Autonomous drone units executing precision strikes with minimal human oversight, ideal for asymmetric warfare."
    combat_unit_type_artillery_9_desc:0 "Coordinated drone swarms overwhelming defenses with synchronized, multi-vector attacks and adaptive targeting."
    combat_unit_type_artillery_10_desc:0 "Electromagnetic railgun platforms delivering hypersonic projectiles with extreme range and kinetic impact."
    combat_unit_type_airforce_1_desc:0 "Light reconnaissance aircraft used for scouting enemy positions and relaying battlefield intelligence."
    combat_unit_type_airforce_2_desc:0 "Agile airframes designed for close-range dogfights and basic air defense in low-speed engagements."
    combat_unit_type_airforce_3_desc:0 "Early-generation jet fighters offering improved speed and altitude performance over prop-driven predecessors."
    combat_unit_type_airforce_4_desc:0 "High-speed interceptors capable of breaking the sound barrier and dominating aerial combat zones."
    combat_unit_type_airforce_5_desc:0 "Versatile aircraft equipped for both air-to-air and air-to-ground missions, adaptable to shifting tactical needs."
    combat_unit_type_airforce_6_desc:0 "Radar-evading fighters engineered for precision strikes and survivability in contested airspace."
    combat_unit_type_airforce_7_desc:0 "Advanced stealth platforms combining multi-role flexibility with low observability and networked combat systems."
    combat_unit_type_airforce_8_desc:0 "High-altitude fighters operating near the edge of the atmosphere, optimized for strategic interception and surveillance."
    combat_unit_type_airforce_9_desc:0 "Remotely piloted or autonomous aerial systems executing reconnaissance, strike, and support missions with minimal risk."
    combat_unit_type_airforce_10_desc:0 "Massive airborne command platforms blending flight, firepower, and fleet coordination in a single skyborne fortress."
    combat_unit_type_light_ship_1_desc:0 "Fast and agile escort vessels designed for anti-submarine warfare, convoy protection, and rapid response."
    combat_unit_type_light_ship_2_desc:0 "Silent hunters beneath the waves, capable of stealthy reconnaissance and devastating torpedo strikes."
    combat_unit_type_light_ship_3_desc:0 "Deep-sea predators powered by nuclear reactors, offering extended range and formidable underwater endurance."
    combat_unit_type_light_ship_4_desc:0 "Advanced submersibles equipped with modern sonar, missile systems, and enhanced stealth capabilities."
    combat_unit_type_light_ship_5_desc:0 "Next-generation submarines optimized for low acoustic signatures and precision strike missions in hostile waters."
    combat_unit_type_capital_ship_1_desc:0 "Heavily armored warships from a bygone era, bristling with cannons and built for line-of-battle dominance."
    combat_unit_type_capital_ship_2_desc:0 "Floating fortresses with massive firepower, designed to control sea lanes and engage enemy fleets head-on."
    combat_unit_type_capital_ship_3_desc:0 "Modern surface combatants armed with guided missiles for long-range precision strikes and fleet defense."
    combat_unit_type_capital_ship_4_desc:0 "High-speed capital ships blending firepower and maneuverability, ideal for fast-paced naval engagements."
    combat_unit_type_capital_ship_5_desc:0 "Compact, versatile warships tailored for near-shore operations, combining speed, stealth, and modular armament."
    combat_unit_type_carrier_1_desc:0 "Seaborne airbases projecting power across oceans, capable of launching and recovering aircraft in combat zones."
    combat_unit_type_carrier_2_desc:0 "Nuclear-powered carriers with unmatched operational range and endurance, supporting sustained global deployments."
    combat_unit_type_carrier_3_desc:0 "Massive flagship carriers hosting large air wings, command centers, and advanced defense systems."
    combat_unit_type_carrier_4_desc:0 "Low-observable carriers designed to evade detection while coordinating stealth air operations and electronic warfare."
    combat_unit_type_carrier_5_desc:0 "Titanic naval platforms integrating air, sea, and drone capabilities into a single mobile command fortress."
