    lawgroup_social_mobility_0:0 "Social Mobility Policy"
    law_social_hierarchy_0_enforced:0 "Poor Social Mobility Policies"
    law_social_hierarchy_0_codified:0 "Decent Social Mobility Policies"
    law_social_hierarchy_0_not_enforced:0 "Good Social Mobility Policies"
    law_social_hierarchy_0_affirmative_action:0 "$law_affirmative_action$"
    law_social_hierarchy_0_enforced_desc:0 "There are few to no programmes to help marginalised groups climb the social ladder."
    law_social_hierarchy_0_codified_desc:0 "There are some programmes to help marginalised groups climb the social ladder."
    law_social_hierarchy_0_not_enforced_desc:0 "There are many programmes to help marginalised groups climb the social ladder and it is enshrined in law that class based discrimination is prohibited."
    law_social_hierarchy_0_affirmative_action_desc:0 "$law_affirmative_action_desc$"
    lawgroup_foreign_investment_policy:0 "Foreign Investment Policy"
    law_no_foreign_investment_policy:0 "Foreign Investment Banned"
    law_nationalist_foreign_investment_policy:0 "Restricted Foreign Investment"
    law_full_foreign_investment_policy:0 "Unrestricted Foreign Investment"
    law_no_foreign_investment_policy_desc:0 "Any form of foreign investment is prohibited in this country. \n\nNote: The prohibition under this law does not apply to existing $foreign_investment_rights$ [concept_treaty] [Concept('concept_article','$concept_articles$')]."
    law_nationalist_foreign_investment_policy_desc:0 "Only inbound foreign investment is permitted (i.e. this country can only receive foreign investment and not give it). \n\nNote: The prohibition under this law does not apply to existing $foreign_investment_rights$ [concept_treaty] [Concept('concept_article','$concept_articles$')]."
    law_full_foreign_investment_policy_desc:0 "All forms of foreign investment are permitted under the law."
    lawgroup_secession_rights:0 "Right to Secede"
    law_no_secession_rights:0 "Inviolable Sovereignty"
    law_limited_secession_rights:0 "Devolution Permitted"
    law_full_secession_rights:0 "Secession Permitted"
    law_no_secession_rights_desc:0 "No constituent state is allowed to gain more autonomy or secede from this country."
    law_limited_secession_rights_desc:0 "Constituent states may be allowed greater autonomy but they may not secede from this country."
    law_full_secession_rights_desc:0 "Constituent states may be allowed greater autonomy and to secede from this country."
    law_no_voting_additional_effects:0 "@information! All [Concept('concept_election','$concept_elections$')] will be non-competitive and the [concept_government] may suspend [Concept('concept_election','$concept_elections$')] from being held for any duration of time."
    law_dominant_party_state_additional_effects:0 "$can_ban_parties.tt$"
    law_parties_allowed_additional_effects:0 "$cannot_ban_parties.tt$"
    law_no_workers_rights:0 "Weak Labour Laws"
    law_regulatory_bodies:0 "Moderate Labour Laws"
    law_worker_protections:0 "Strong Labour Laws"
    lawgroup_armed_forces_politicisation:0 "Military Politicisation"
    law_politicised_armed_forces:0 "Politicised Military"
    law_semi_politicised_armed_forces:0 "Semi-Politicised Military"
    law_no_politicised_armed_forces:0 "Neutral Military"
    law_politicised_armed_forces_desc:0 "The military exercises total loyalty to a single political party and consistently advocates for and defends partisan political positions and fortunes."
    law_semi_politicised_armed_forces_desc:0 "The military exercises some loyalty to a single political party and consistently advocates for and defends partisan political positions and fortunes."
    law_no_politicised_armed_forces_desc:0 "The military stays out of politics entirely."
    law_no_politicised_armed_forces_additional_effects:0 "@warning! [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] cannot join any [Concept('concept_party', '$concept_parties$')] under this [concept_law]."
    lawgroup_minority_issues:0 "Lifestyle Laws"
    law_no_minority_issues:0 "Traditionalist Lifestyles Only"
    law_some_minority_issues:0 "Conservative Lifestyle Laws"
    law_full_minority_issues:0 "Liberal Lifestyles Permitted"
    law_no_minority_issues_desc:0 "The government takes a traditionalist stance towards social issues like drinking, drugs and LGBTQ+ rights. \n\nUnder this [concept_law], pop consumption of [GetGoods('opium').GetName], [GetGoods('tobacco').GetName], [GetGoods('liquor').GetName] and [GetGoods('wine').GetName] will be banned."
    law_some_minority_issues_desc:0 "The government takes a conservative stance towards social issues like drinking, drugs and LGBTQ+ rights. \n\nUnder this [concept_law], pop consumption of [GetGoods('opium').GetName]  will be banned."
    law_full_minority_issues_desc:0 "The government takes a permissive stance towards social issues like drinking, drugs and LGBTQ+ rights."
    amendment_symbolic_monarchy:0 "Symbolic Monarchy"
    amendment_symbolic_monarchy_desc:0 "Under the Constitution, the monarch's legal status is that of "the symbol of the State and of the unity of the people", with no powers related to government. The position is entirely ceremonial and derives its legitimacy from the will of the people, with whom sovereignty resides."
    amendment_no_nobility:0 "Non-Royal Aristocracy Prohibited"
    amendment_no_nobility_desc:0 "Under the Constitution, hereditary aristocratic privileges are abolished. No class of nobility holds legal status or authority, and all citizens are equal before the law."
    amendment_rotating_presidency:0 "Collective Head of State"
    amendment_rotating_presidency_desc:0 "A collective head of state is a system of government where the ceremonial and executive duties of a head of state are shared by a group of people rather than vested in a single individual."
    lawgroup_voting_method_desc:0 "The rules and procedures governing how elections are conducted."
    lawgroup_political_parties_desc:0 "Whether political parties are permitted and how they operate."
    lawgroup_judiciary_desc:0 "The composition and independence of the judiciary."
    lawgroup_cabinet_composition_desc:0 "How the executive cabinet is selected and organised."
    lawgroup_term_limits_desc:0 "Rules restricting how long a ruler may remain in office."
    lawgroup_secession_rights_desc:0 "Whether constituent states or regions have the right to secede."
    lawgroup_armed_forces_politicisation_desc:0 "The extent to which the military is involved in politics."
    lawgroup_constitutional_system_desc:0 "The overarching constitutional framework of the state."
    lawgroup_legal_system_desc:0 "The structure and principles of the legal system."
    lawgroup_head_of_government_desc:0 "Defines the role and powers of the head of government."
    lawgroup_legislature_desc:0 "The organisation and authority of the legislature."
    lawgroup_legislative_chambers_desc:0 "Whether the legislature is unicameral or bicameral."
    lawgroup_centralisation_desc:0 "The balance between central and regional authority."
    lawgroup_war_policy_desc:0 "The nation's stance on war and military engagement."
    lawgroup_corruption_policy_desc:0 "Policies addressing corruption and accountability."
    lawgroup_minority_issues_desc:0 "Policies addressing the rights and protections of minority groups."
    lawgroup_wmd_policy_desc:0 "Regulations regarding weapons of mass destruction."
    lawgroup_espionage_policy_desc:0 "Rules governing espionage and intelligence activities."
    lawgroup_social_mobility_0_desc:0 "Social hierarchy and mobility under a default system."
    lawgroup_social_mobility_1_desc:0 "Social hierarchy and mobility under feudalism."
    lawgroup_social_mobility_2_desc:0 "Social hierarchy and mobility under theocracy."
    lawgroup_social_mobility_3_desc:0 "Social hierarchy and mobility under nationalism."
    lawgroup_social_mobility_4_desc:0 "Social hierarchy and mobility under communism."
    lawgroup_social_mobility_5_desc:0 "Social hierarchy and mobility under oligarchy."
    lawgroup_monetary_policy_desc:0 "Policies governing currency supply and interest rates."
    lawgroup_industry_regulations_desc:0 "Rules regulating industrial activity."
    lawgroup_financial_regulations_desc:0 "Regulations governing financial institutions and markets."
    lawgroup_company_regulations_desc:0 "Regulations governing companies and their ability to influence the market."
    lawgroup_land_ownership_desc:0 "Rules defining land ownership and property rights."
    lawgroup_environmental_policy_desc:0 "Policies addressing environmental protection and pollution control."
    lawgroup_foreign_policy_desc:0 "The nation's approach to international relations and diplomacy."
    lawgroup_foreign_investment_policy_desc:0 "Rules governing foreign investment and external capital."
    lawgroup_pop_growth_policy_desc:0 "Policies regulating population growth and family planning."
    lawgroup_economic_specialisation_desc:0 "Economic focus and specialization of the nation."
    lawgroup_monetary_system_desc:0 "Laws governing the degree of autonomy granted to the central bank."
    lawgroup_gender_issues:0 "LGBT Rights"
    law_no_gender_issues:0 "LGBT Outlawed"
    law_some_gender_issues:0 "LGBT Tolerated"
    law_full_gender_issues:0 "LGBT Accepted"
    law_no_gender_issues_desc:0 "Same‑sex relationships and gender diversity are criminalised, with strict enforcement and no legal protections."
    law_some_gender_issues_desc:0 "Same‑sex relationships and gender diversity are legally permitted but face social stigma and limited recognition."
    law_full_gender_issues_desc:0 "Same‑sex relationships and gender diversity are fully recognised, with comprehensive legal protections and social acceptance."
    amendment_corporate_state:0 "$law_corporate_state$"
    amendment_corporate_state_desc:0 "$law_corporate_state_desc$"
    lawgroup_minimum_wage:0 "Minimum Wage"
    law_no_minimum_wage:0 "No Minimum Wage"
    law_no_minimum_wage_desc:0 "Workers receive wages entirely determined by employers, with no statutory minimum or legal protections."
    law_low_minimum_wage:0 "Low Minimum Wage"
    law_low_minimum_wage_desc:0 "A basic minimum wage is established, offering limited protection but often insufficient to meet living costs."
    law_medium_minimum_wage:0 "Moderate Minimum Wage"
    law_medium_minimum_wage_desc:0 "A moderate minimum wage ensures fairer compensation, balancing worker protections with business flexibility."
    law_high_minimum_wage:0 "High Minimum Wage"
    law_high_minimum_wage_desc:0 "A high minimum wage provides strong worker protections and guarantees living standards, though it imposes significant constraints on employers."
    law_independent_central_bank:0 "Independent Central Bank"
    law_independent_central_bank_desc:0 "The central bank operates autonomously, free from executive influence, with full authority over monetary policy."
    law_semi_independent_central_bank:0 "Semi‑Independent Central Bank"
    law_semi_independent_central_bank_desc:0 "The central bank retains partial autonomy, but key decisions require consultation or approval from the executive branch."
    law_non_independent_central_bank:0 "Non‑Independent Central Bank"
    law_non_independent_central_bank_desc:0 "The central bank is directly controlled by the executive branch, with little or no independent authority over monetary policy."
    je_central_bank_effect.tt:0 "The effects of this [concept_law] are simulated by the #y Central Bank#! [concept_journal_entry]"
