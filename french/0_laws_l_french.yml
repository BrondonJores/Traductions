    law_medium_social_security_desc:0 "$law_wage_subsidies_desc$"
    law_high_social_security_desc:0 "$law_old_age_pension_desc$"
    law_very_low_anti_corruption_desc:0 "La corruption est pratiquement légalisée."
    law_low_anti_corruption_desc:0 "Seules les pires formes de corruption sont interdites."
    law_medium_anti_corruption_desc:0 "La corruption est quelque peu interdite."
    law_high_anti_corruption_desc:0 "La plupart des types de corruption sont interdits par la loi."
    law_very_high_anti_corruption_desc:0 "Toute forme de corruption est interdite par la loi."
    law_gold_standard_desc:0 "L'étalon-or est un système monétaire dans lequel l'unité de compte économique standard est basée sur une quantité fixe d'or."
    law_semi_gold_standard_desc:0 "L'étalon semi-or est un système monétaire dans lequel l'unité de compte économique standard est basée sur une quantité fixe d'or et une quantité fixe d'une devise étrangère."
    law_fiat_standard_desc:0 "La monnaie fiduciaire est un type de devise qui n'est pas adossée à un métal précieux, tel que l'or ou l'argent, ou adossée à tout autre actif ou commodité tangible."
    law_taxation_1_desc:0 "Les lois fiscales favorisent fortement les riches."
    law_taxation_2_desc:0 "Les lois fiscales favorisent les riches."
    law_taxation_3_desc:0 "Les lois fiscales ne favorisent ni les riches ni les pauvres."
    law_taxation_4_desc:0 "Les lois fiscales favorisent les pauvres au détriment des riches."
    law_taxation_5_desc:0 "Les lois fiscales favorisent massivement les pauvres au détriment des riches."
    law_very_deflationary_monetary_policy_desc:0 "Une politique monétaire très déflationniste vise à réduire la masse monétaire et à augmenter les taux d'intérêt pour combattre l'inflation en freinant la demande globale et en refroidissant l'économie."
    law_neutral_monetary_policy_desc:0 "Une politique monétaire neutre est le taux d'intérêt qui ne stimule ni ne restreint la croissance économique, visant une approche équilibrée de l'inflation et de la croissance."
    law_expansionary_monetary_policy_desc:0 "La politique monétaire expansionniste, mise en œuvre par les banques centrales, vise à stimuler la croissance économique en augmentant la masse monétaire et en abaissant les taux d'intérêt, encourageant les emprunts et les dépenses."
    law_very_expansionary_monetary_policy_desc:0 "Une politique monétaire très expansionniste vise à stimuler massivement la croissance économique."
    law_charitable_health_system_desc:0 "Les soins de santé sont fournis par des institutions caritatives et à but non lucratif."
    law_private_health_insurance_desc:0 "Les soins médicaux sont financés par des régimes d'assurance privés."
    law_public_health_insurance_desc:0 "L'État garantit les soins de santé pour tous."
    law_religious_schools_desc:0 "L'éducation est confiée à des institutions privées, souvent guidées par des traditions religieuses."
    law_private_schools_desc:0 "Les écoles reçoivent un soutien partiel de l'État tout en conservant une gestion privée."
    law_public_schools_desc:0 "L'État garantit la scolarité gratuite pour tous les enfants."
    law_pro_pop_growth_policy_desc:0 "Le gouvernement offre des incitations aux familles pour avoir des enfants."
    law_no_pop_growth_policy_desc:0 "Le gouvernement n'interfère pas avec le choix d'avoir des enfants."
    law_anti_pop_growth_policy_desc:0 "Le gouvernement pénalise les familles qui ont trop d'enfants."
    law_no_colonial_affairs:0 "Anticolonialisme"
    lawgroup_distribution_of_power_desc:0 "Les droits de vote déterminent le pouvoir électoral de chaque personne dans le pays."
