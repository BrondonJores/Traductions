    law_no_minority_issues_desc:0 "Le gouvernement adopte une position traditionaliste sur les questions sociales telles que l'alcool, la drogue et les droits LGBTQ+. \n\nSous cette [concept_law], la consommation par les populations de [GetGoods('opium').GetName], de [GetGoods('tobacco').GetName], de [GetGoods('liquor').GetName] et de [GetGoods('wine').GetName] sera interdite."
    law_some_minority_issues_desc:0 "Le gouvernement adopte une position conservatrice sur les questions sociales. \n\nSous cette [concept_law], la consommation par les populations de [GetGoods('opium').GetName] sera interdite."
    law_full_minority_issues_desc:0 "Le gouvernement adopte une position permissive sur les questions sociales telles que l'alcool, la drogue et les droits LGBTQ+."
