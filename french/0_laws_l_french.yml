    #DESC#
    
    #Economic Specialization Laws
    law_no_economic_specialisation_desc:0 "Ce pays n'est pas spécialisé dans une industrie spécifique."
    law_natural_resource_focus_desc:0 "Ce pays est spécialisé dans l'exploitation de ses ressources naturelles."
    law_manufacturing_focus_desc:0 "Ce pays est spécialisé dans l'industrie manufacturière."
    law_services_focus_desc:0 "Ce pays est spécialisé dans l'industrie des services."
    
    #Economic System Laws
    law_state_capitalism_desc:0 "Système économique dans lequel l'État entreprend des activités économiques commerciales et où les moyens de production sont nationalisés en tant qu'entreprises d'État."
    
    #Energy Policy
    law_no_nuclear_energy_desc:0 "L'énergie nucléaire est interdite."
    law_nuclear_energy_desc:0 "L'énergie nucléaire est autorisée."
    
    #Environmental Policy
    law_no_environment_law_desc:0 "Le gouvernement ne dispose d'aucune réglementation ou loi protégeant l'environnement."
    law_weak_environment_law_desc:0 "Le gouvernement dispose de réglementations ou de lois relativement faibles en matière de protection de l'environnement."
    law_moderate_environment_law_desc:0 "Le gouvernement a adopté des réglementations ou des lois modérées en matière de protection de l'environnement."
    law_strong_environment_law_desc:0 "Le gouvernement a mis en place des réglementations ou des lois strictes pour protéger l'environnement."
    
    #Financial Regulation
    law_weak_financial_regulations_desc:0 "Les lois et réglementations financières du gouvernement sont insuffisantes."
    law_moderate_financial_regulations_desc:0 "Le gouvernement dispose d'une législation et d'une réglementation financières modérées."
    law_strong_financial_regulations_desc:0 "Le gouvernement dispose d'une législation et d'une réglementation financières solides."
    
    #Foreign Policy
    law_nationalist_fp_desc:0 "Une politique étrangère qui se concentre uniquement sur les efforts internes d'une nation."
    law_regionalist_fp_desc:0 "Une politique étrangère qui vise à établir des relations avec les voisins régionaux d'un pays."
    law_globalist_fp_desc:0 "Une politique étrangère qui vise à établir des relations avec le monde interconnecté dans son ensemble."
    
    #Industry Regulation
    law_pro_consumer_regulations_desc:0 "Le gouvernement met en place des réglementations qui favorisent le consommateur plutôt que l'industrie.."
    law_balanced_regulations_desc:0 "Le gouvernement a mis en place des réglementations visant à établir un équilibre entre les droits des consommateurs et ceux de l'industrie.."
    law_pro_industry_regulations_desc:0 "Le gouvernement a mis en place des réglementations qui favorisent le secteur industriel plutôt que le consommateur."
    
    #Monetary Policy
    law_deflationary_monetary_policy_desc:0 "Le gouvernement vise à équilibrer le budget national."
    law_no_term_limit:0 "No Term Limit"
    law_no_term_limit_desc:0 "The [concept_ruler] may remain in office for an unlimited number of terms."
    law_yes_term_limit:0 "Term Limited"
    law_yes_term_limit_desc:0 "The [concept_ruler] may not remain in office past a set number of years."
    law_peasant_levies_additional_effects:0 ""
    law_semi_command_economy_desc:0 "This is a form of economic system where the government owns and controls all enterprises but some operational decision making is left to the workers."
    law_social_capitalism:0 "Social Capitalism"
    law_social_capitalism_desc:0 "Social Capitalism is a socioeconomic model combining a free-market capitalist economic system alongside social policies and enough regulation to establish both fair competition within the market."
    law_unitary_state_desc:0 "A centralised unitary state is a sovereign state governed as a single entity in which the central government is the supreme authority."
    law_devolved_state:0 "Decentralised Unitary State"
    law_devolved_state_desc:0 "A decentralised unitary state is a country where the central government holds supreme authority but has delegated some powers to lower levels of government, such as provinces or municipalities. This is different from a centralised unitary state where the central government retains all significant power."
    law_federal_state_desc:0 "A federal state is an entity characterised by a union of partially self-governing provinces, states, or other regions under a federal government."
    law_politicised_judiciary_desc:0 "Judges are directly appointed by executive branch."
    law_partially_politicised_judiciary_desc:0 "Judges are jointly appointed by executive and legislative branches."
    law_independent_judiciary_desc:0 "The appointments of judges are free from any interference from the executive and legislative branches."
    law_no_voting_desc:0 "The country does not hold [Concept('concept_election','$concept_elections$')], with leadership determined through other means."
    law_rigged_voting_desc:0 "Election outcomes are managed to ensure consistent support for the government."
    law_gerrymandered_voting_desc:0 "Voting districts are drawn in a way that structurally benefits the ruling party."
    law_harassment_voting_desc:0 "Campaign regulations and practices place opposition candidates at a disadvantage."
    law_fair_voting_desc:0 "Voting and campaigning are conducted under transparent and equitable rules."
    law_first_past_the_post:0 "First Past the Post"
    law_first_past_the_post_desc:0 "First-past-the-post voting is a plurality voting system wherein voters cast a vote for a single candidate, and the candidate with the most votes wins the election. \n\n@information! This [concept_law] encourages weaker [Concept('concept_interest_group', '$concept_interest_groups$')] to align with stronger [Concept('concept_party', '$concept_parties$')] despite ideological differences."
    law_jefferson_system:0 "Jefferson Method"
    law_jefferson_system_desc:0 "The Jefferson method is an apportionment method for allocating seats in parliaments. After all the votes have been tallied, successive quotients are calculated for each party. The party with the largest quotient wins one seat, and its quotient is recalculated. This is repeated until the required number of seats is filled. \n\n@information! This [concept_law] encourages weaker [Concept('concept_interest_group', '$concept_interest_groups$')] to align with stronger [Concept('concept_party', '$concept_parties$')] despite ideological differences."
    law_propotional_representation:0 "Proportional Representation"
    law_propotional_representation_desc:0 "Proportional representation refers to any type of electoral system under which subgroups of an electorate are reflected proportionately in the elected body."
    law_first_past_the_post_additional_effects:0 "@information! This changes the composition of the #y Legislature#!."
    law_jefferson_system_additional_effects:0 "@information! This changes the composition of the #y Legislature#!."
    law_propotional_representation_additional_effects:0 "@information! This changes the composition of the #y Legislature#!."
    law_parties_not_allowed_desc:0 "No political parties may be registered in the country. \n\n@information! If this [concept_country] has [Concept('concept_party', '$concept_parties$')], they will be converted into [Concept('concept_political_faction', '$concept_political_factions$')]."
    law_single_party_state:0 "Single-Party State"
    law_single_party_state_desc:0 "The state is governed by a single legal political party, which has a monopoly on all political activity within the nation. \n\n@information! If this [concept_country] has [Concept('concept_election','$concept_elections$')], the elections will be held as [Concept('concept_non_competitive_election','$concept_non_competitive_elections$')] instead. Such elections will be handled by a special [concept_journal_entry]."
    law_dominant_party_state:0 "Dominant-Party System"
    law_dominant_party_state_desc:0 "Although multiple political parties may exist in the country, the ruling party exerts great sway over all political activity within the nation. \n\n@information! Under this [concept_law], only [Concept('concept_interest_group', '$concept_interest_groups$')] which are in the [concept_government] or have more than #y 10%#! [concept_clout] may join [Concept('concept_party', '$concept_parties$')]."
    law_parties_allowed_desc:0 "Any political party may be registered with the electoral commission and run for elections."
    concept_non_competitive_election:0 "Non-Competitive Election"
    concept_non_competitive_elections:0 "Non-Competitive Elections"
    concept_non_competitive_election_desc:0 "Non-competitive elections are [Concept('concept_election','$concept_elections$')] where only candidates affiliated with and approved by the [concept_government] are allowed to run for office."
    concept_political_faction:0 "Political Faction"
    concept_political_factions:0 "Political Factions"
    concept_political_faction_desc:0 "Informal political alliances and factions take the place of formal [Concept('concept_party', '$concept_parties$')] in a [concept_country] where [Concept('concept_party', '$concept_parties$')] are banned. \n\nHowever, due to the game's [Concept('concept_election','$concept_elections$')] mechanics requiring parties for an [concept_interest_group] to receive [concept_votes], political factions are represented by [Concept('concept_interest_group', '$concept_interest_groups$')] joining #y "Political Faction"#! [Concept('concept_party', '$concept_parties$')]. \n\nThese #y "Political Faction"#! [Concept('concept_party', '$concept_parties$')] do not benefit from certain mechanics simulating formal parties, such as the ability to ban parties."
    law_appointed_legislature_desc:0 "La législature fonctionne principalement comme un organe consultatif, avec une indépendance limitée vis-à-vis de l'exécutif."
    law_technocratic_legislature_desc:0 "La législature exerce un rôle restreint, équilibrant la surveillance avec la déférence à l'autorité exécutive."
    law_democratic_legislature_desc:0 "La législature détient une autorité significative, servant d'institution centrale dans la gouvernance et la responsabilité publique."
    law_appointed_legislature_additional_effects:0 "@information! Cette [concept_law] peut changer le [concept_government_type] du [concept_country]."
    law_technocratic_legislature_additional_effects:0 "@information! Cette [concept_law] peut changer le [concept_government_type] du [concept_country]."
    law_democratic_legislature_additional_effects:0 "@information! Cette [concept_law] peut changer le [concept_government_type] du [concept_country]."
    law_unicameralism:0 "Législature monocamérale"
    law_hybrid_chamber:0 "Législature hybride"
    law_bicameralism:0 "Législature bicamérale"
    law_unicameralism_desc:0 "Le monocaméralisme est un type de législature composé d'une seule chambre ou assemblée, qui légifère et vote en tant qu'entité unique."
    law_hybrid_chamber_desc:0 "Le pays dispose d'une législature monocamérale avec un chef d'État largement cérémoniel, ou un organe exécutif indépendant du [concept_ruler] qui dispose d'un droit de veto sur les lois adoptées par le [concept_government]."
    law_bicameralism_desc:0 "Le bicaméralisme est un type de législature divisé en deux assemblées, chambres ou maisons distinctes, connues sous le nom de législature bicamérale."
    law_politicised_bureaucrats_desc:0 "Tous les fonctionnaires sont sélectionnés par le gouvernement pour leur loyauté."
    law_elitist_bureaucrats_desc:0 "Tous les fonctionnaires sont sélectionnés par les élites de la fonction publique."
    law_professional_bureaucrats_desc:0 "Tous les fonctionnaires sont sélectionnés par un processus de recrutement libre et équitable qui évalue le mérite de la personne."
    law_professional_bureaucrats_additional_effects:0 "@warning! [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant] ne peut rejoindre aucun [Concept('concept_party', '$concept_parties$')] sous cette [concept_law]."
    lawgroup_company_regulations:0 "Réglementation des entreprises"
    law_weak_company_regulations:0 "Réglementation faible des entreprises"
    law_moderate_company_regulations:0 "Réglementation équilibrée des entreprises"
    law_strong_company_regulations:0 "Réglementation stricte des entreprises"
    law_weak_company_regulations_desc:0 "Un cadre laxiste avec une surveillance minimale, offrant aux entreprises une grande liberté mais peu de protections pour les travailleurs et les consommateurs."
    law_moderate_company_regulations_desc:0 "Un cadre équilibré avec une surveillance raisonnable, garantissant des pratiques équitables tout en maintenant une flexibilité pour les opérations commerciales."
    law_strong_company_regulations_desc:0 "Un cadre rigoureux avec une surveillance étendue, privilégiant les droits des travailleurs et la protection des consommateurs, bien qu'imposant des contraintes significatives aux entreprises."
    law_HOS_monarch_desc:0 "$law_monarchy_desc$"
    law_HOS_president_desc:0 "$law_presidential_republic_desc$"
    law_HOS_religious_leader_desc:0 "$law_theocracy_desc$"
    law_HOS_nationalist_leader_desc:0 "Il s'agit d'un [concept_government_type] où le pouvoir politique est concentré entre les mains des $ig_armed_forces$ du pays."
    law_HOS_communist_leader_desc:0 "$law_council_republic_desc$"
    law_HOG_none_desc:0 "Le [concept_ruler] est à la fois chef de l'État et chef du gouvernement."
    law_HOG_prime_minister_desc:0 "Le [concept_ruler] est le chef du gouvernement, tandis qu'une personne distincte agit en tant que chef de l'État honorifique."
    law_HOG_president_prime_minister_desc:0 "Les pouvoirs exécutifs sont répartis entre le [concept_ruler], qui est le chef de l'État, et le chef du gouvernement."
    law_nepotistic_cabinet_desc:0 "Le Cabinet n'est composé que des amis et de la famille du dirigeant."
    law_semi_nepotistic_cabinet_desc:0 "Le Cabinet est partiellement composé des amis et de la famille du dirigeant."
    law_meritocratic_cabinet_desc:0 "Les membres du Cabinet sont choisis en fonction de leurs compétences et non de leurs liens avec le dirigeant."
    law_executive_supremacy_desc:0 "Le pouvoir législatif et le pouvoir judiciaire ne peuvent pas annuler une décision du pouvoir exécutif."
    law_legislative_supremacy_desc:0 "L'exécutif et le judiciaire ne peuvent pas annuler une décision du pouvoir législatif."
    law_constitutional_supremacy_desc:0 "La constitution est la loi suprême du pays et ne peut être modifiée que par un amendement constitutionnel de la législature."
    law_kangaroo_law_desc:0 "Le pouvoir judiciaire n'est pas autorisé à annuler les décisions du pouvoir exécutif ou législatif."
    law_civil_law_desc:0 "Le pouvoir judiciaire est autorisé à annuler certains types d'actions de l'exécutif et de [Concept('concept_law','$concept_laws$')] non constitutionnelles."
    law_common_law_desc:0 "Le pouvoir judiciaire a le plein pouvoir d'annuler les actions de l'exécutif et les [Concept('concept_law','$concept_laws$')]."
    law_peasant_levies_desc:0 "L'État n'est pas autorisé à avoir une armée permanente."
    law_mass_conscription:0 "Armée de conscrits"
    law_mass_conscription_desc:0 "L'armée est composée de militaires professionnels et de conscrits."
    law_no_womens_rights_desc:0 "Les femmes sont privées de tous les droits légaux, exclues de la propriété, de l'emploi et de la participation politique."
    law_women_own_property_desc:0 "Les femmes peuvent posséder des biens et exercer des droits légaux fondamentaux, mais restent exclues de la plupart des emplois et de la participation politique."
    law_women_in_the_workplace:0 "Égalité des droits des femmes"
    law_women_in_the_workplace_desc:0 "Les femmes jouissent de l'égalité des droits en matière de propriété, d'emploi et de statut juridique, bien que la participation politique puisse encore être restreinte par les réalités pratiques."
    law_womens_suffrage_desc:0 "Les politiques encouragent activement la participation des femmes à la politique, à l'emploi et à l'éducation. Des mesures telles que des quotas et des programmes ciblés assurent une représentation et des opportunités égales au-delà de l'égalité juridique formelle."
    law_limited_free_speech_desc:0 "$law_right_of_assembly_desc$"
    law_full_free_speech_desc:0 "$law_protected_speech_desc$"
    law_no_secret_police_desc:0 "Il n'y a pas de police secrète dans le pays."
    law_no_espionage_desc:0 "L'État ne dispose d'aucun service de renseignement étranger."
    law_defensive_espionage_desc:0 "L'État dispose d'un service de renseignement étranger habilité à contrer l'influence et les activités étrangères dans le pays."
    law_offensive_espionage_desc:0 "L'État dispose d'un service de renseignement étranger habilité à contrer l'influence et les activités étrangères dans le pays et à mener un espionnage hostile contre d'autres pays."
    law_lenient_policing_desc:0 "Les pouvoirs d'application et d'investigation de la police sont fortement biaisés en faveur de l'accusé."
    law_balanced_policing_desc:0 "Les pouvoirs d'application et d'investigation de la police sont équilibrés par rapport aux intérêts de l'accusé."
    law_strict_policing_desc:0 "Les pouvoirs d'application et d'investigation de la police sont biaisés en faveur de la police."
    law_draconian_policing_desc:0 "Les prisonniers et les personnes accusées sont à la merci totale de la police."
    law_slavery_banned_desc:0 "Il n'y a pas de camps de concentration dans le pays."
    law_slavery_political:0 "Goulags"
    law_slavery_political_desc:0 "Les dissidents politiques sont emprisonnés dans de vastes camps de concentration et sont soumis au travail forcé."
    law_slavery_cultural:0 "Répression culturelle"
    law_slavery_cultural_desc:0 "Le gouvernement réprime systématiquement toute personne discriminée par [concept_culture] ou [concept_religion] dans le pays."
    law_colonial_resettlement:0 "Édification de la nation coloniale"
    law_colonial_resettlement_desc:0 "Les colonies doivent être développées à la fois sur le plan industriel et politique."
    law_colonial_exploitation_desc:0 "Les colonies ne sont utilisées que pour l'extraction de ressources et aucun droit politique ne sera accordé aux autochtones."
    law_trade_unions_banned_desc:0 "Aucun syndicat n'est autorisé dans le pays."
    law_state_trade_unions_desc:0 "Seuls les syndicats contrôlés par l'État sont autorisés dans le pays."
    law_restricted_trade_unions_desc:0 "Les syndicats indépendants sont autorisés mais leurs pouvoirs sont limités."
    law_full_trade_unions_desc:0 "Les syndicats indépendants sont autorisés et leurs pouvoirs pour mener des actions revendicatives sont illimités."
    law_no_war_desc:0 "Nous ne sommes pas autorisés à déclarer la guerre ou à rejoindre une alliance militaire ou politique internationale."
    law_defensive_war_desc:0 "Nous ne sommes autorisés à déclarer que certains types de guerres."
    law_offensive_war_desc:0 "Il n'y a aucune restriction quant aux types de guerres que nous pouvons lancer."
    law_wmd_banned_desc:0 "Nous ne sommes pas autorisés à développer ou posséder des armes de destruction massive."
    law_wmd_allowed_desc:0 "Nous sommes autorisés à développer ou posséder des armes de destruction massive."
    law_space_program_public:0 "Programme spatial public"
    law_space_program_private:0 "Programme spatial privé"
    law_low_social_security_desc:0 "$law_poor_laws_desc$"
    law_medium_social_security_desc:0 "$law_wage_subsidies_desc$"
    law_high_social_security_desc:0 "$law_old_age_pension_desc$"
    law_very_low_anti_corruption_desc:0 "La corruption est pratiquement légalisée."
    law_low_anti_corruption_desc:0 "Seules les pires formes de corruption sont interdites."
    law_medium_anti_corruption_desc:0 "La corruption est partiellement interdite."
    law_high_anti_corruption_desc:0 "La plupart des formes de corruption sont interdites par la loi."
    law_very_high_anti_corruption_desc:0 "La corruption sous toutes ses formes est interdite par la loi."
    law_gold_standard_desc:0 "L'étalon-or est un système monétaire dans lequel l'unité de compte économique standard est basée sur une quantité fixe d'or."
    law_semi_gold_standard_desc:0 "Le système de l'étalon-or partiel est un système monétaire dans lequel l'unité de compte économique standard est basée sur une quantité fixe d'or et une quantité fixe d'une devise étrangère."
    law_fiat_standard_desc:0 "La monnaie fiduciaire est un type de devise qui n'est pas adossée à un métal précieux, tel que l'or ou l'argent, ni adossée à aucun autre actif ou marchandise tangible."
    law_taxation_1_desc:0 "Tax laws heavily favour the wealthy."
    law_taxation_2_desc:0 "Tax laws favour the wealthy."
    law_taxation_3_desc:0 "Tax laws neither favour the wealthy nor the poor."
    law_taxation_4_desc:0 "Tax laws favour the poor at the expense of the wealthy."
    law_taxation_5_desc:0 "Tax laws massively favour the poor at the expense of the wealthy."
    law_very_deflationary_monetary_policy_desc:0 "Very Deflationary Monetary Policy aims to reduce the money supply and increase interest rates to combat inflation by curbing aggregate demand and cooling down the economy."
    law_neutral_monetary_policy_desc:0 "A Neutral Monetary Policy is the interest rate that neither stimulates nor restrains economic growth, aiming for a balanced approach to inflation and growth."
    law_expansionary_monetary_policy_desc:0 "Expansionary Monetary Policy, implemented by central banks, aims to stimulate economic growth by increasing the money supply and lowering interest rates, encouraging borrowing and spending."
    law_very_expansionary_monetary_policy_desc:0 "Very Expansionary Monetary Policy, implemented by central banks, aims to stimulate economic growth by increasing the money supply and lowering interest rates, encouraging borrowing and spending."
    law_charitable_health_system_desc:0 "Healthcare is provided through charitable and non-profit institutions. Access depends on donations and community support, leaving coverage uneven and often limited."
    law_private_health_insurance_desc:0 "Medical care is financed through private insurance schemes. Citizens must pay premiums, and access reflects wealth and employment, reinforcing social divides."
    law_public_health_insurance_desc:0 "The state guarantees healthcare for all. Funded by public resources, this system ensures universal access, reshaping society around collective welfare and security."
    law_religious_schools_desc:0 "Education is entrusted to private institutions, often guided by religious or community traditions. Access is limited, and curricula reflect the values of those who fund them."
    law_private_schools_desc:0 "Schools receive partial state support while retaining private management. This balance expands access but preserves elite influence over education."
    law_public_schools_desc:0 "The state guarantees free schooling for all children. Universal access reshapes society, fostering literacy, civic identity, and social mobility."
    law_pro_pop_growth_policy_desc:0 "The government provides incentives to families to have children."
    law_no_pop_growth_policy_desc:0 "The government does not interfere with an individual's choice to have children."
    law_anti_pop_growth_policy_desc:0 "The government penalises families who have too many children."
    law_no_colonial_affairs:0 "Anti-Colonialism"
    lawgroup_distribution_of_power_desc:0 "Voting Rights determines how much voting power every person has in the country."
    lawgroup_voting_method:0 "Electoral System"
    lawgroup_voting_method_desc:0 "An electoral system is a set of rules that determine how elections and referendums are conducted and how their results are determined."
    lawgroup_legislative_chambers:0 "Legislative System"
    lawgroup_term_limits:0 "Ruler's Term"
    lawgroup_term_limits_desc:0 "Term limits restrict how long a particular person can be the [concept_ruler] of the country."
    lawgroup_land_ownership:0 "Land Ownership"
    lawgroup_espionage_policy:0 "Espionage Policy"
    law_child_labor_allowed:0 "Compulsory Primary Schooling"
    law_child_labor_allowed_desc:0 "All children must attend several years of primary school during which they're prohibited from working."
    law_restricted_child_labor:0 "Compulsory Secondary Schooling"
    law_restricted_child_labor_desc:0 "All minors must first attain a high school diploma before they are allowed to work."
    law_compulsory_primary_school:0 "Compulsory Tertiary Schooling"
    law_compulsory_primary_school_desc:0 "All minors must first attain a tertiary education qualification before they are allowed to work."
    law_no_private_land_ownership:0 "$law_collectivized_agriculture$"
    law_no_private_land_ownership_desc:0 "$law_collectivized_agriculture_desc$"
    law_limited_private_land_ownership:0 "$law_homesteading$"
    law_limited_private_land_ownership_desc:0 "$law_homesteading_desc$"
    law_full_private_land_ownership:0 "$law_commercialized_agriculture$"
    law_full_private_land_ownership_desc:0 "$law_commercialized_agriculture_desc$"
    law_social_hierarchy_enforced:0 "Nepotistic Social Structure"
    law_social_hierarchy_codified:0 "Elitist Social Structure"
    law_social_hierarchy_not_enforced:0 "Meritocratic Social Structure"
    law_social_hierarchy_enforced_desc:0 "Relatives or friends are given advantages, such as jobs or positions, over more qualified candidates."
    law_social_hierarchy_codified_desc:0 "Party members are given advantages, such as jobs or positions, over more qualified candidates."
    law_social_hierarchy_not_enforced_desc:0 "Everyone has a fair opportunity to gain jobs or positions."
    lawgroup_social_mobility:0 "Social Stratification"
    lawgroup_social_mobility_1:0 "$lawgroup_social_mobility$ (Aristocratic)"
    lawgroup_social_mobility_2:0 "$lawgroup_social_mobility$ (Theocratic)"
    lawgroup_social_mobility_3:0 "$lawgroup_social_mobility$ (Militaristic)"
    lawgroup_social_mobility_4:0 "$lawgroup_social_mobility$ (Communist)"
    lawgroup_social_mobility_5:0 "$lawgroup_social_mobility$ (Oligarchic)"
