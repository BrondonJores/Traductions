l_french:

    GENERIC_FLAVOR_TEXT:0 "La Guerre froide est une période de tension géopolitique entre le bloc de l'Est et le bloc de l'Ouest. Quels nouveaux défis cette époque apportera-t-elle ?"
    REV_GENERIC_FLAVOR_TEXT:1 "Mécontents de la direction prise par le soi-disant gouvernement organisé, ces révolutionnaires ont décidé de prendre les armes pour le renverser. Réussiront-ils à s'emparer du pouvoir ou seront-ils écrasés comme tant de révolutions oubliées du passé ?"
    DECENTRALIZED_FLAVOR_TEXT:0 "Enclavé par des puissances plus organisées, ce pays lutte pour maintenir son autonomie. Verra-t-il l'aube d'un nouveau siècle, ou son nom ne survivra-t-il que dans les livres d'histoire ?"
