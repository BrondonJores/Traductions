    gov_semi_constitutional_empire:0 "Semi-Constitutional Monarchy"
    gov_semi_constitutional_empire_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] or [Concept('concept_ruler','$RULER_TITLE_EMPRESS$')] is the [concept_head_of_state], but [Concept('concept_votes','$concept_voting$')] and a constitution partially influences the [Concept('concept_law','$concept_laws$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_elective_monarchy:0 "Elective Monarchy"
    gov_elective_monarchy_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_KING$')] or [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] is chosen by a vote instead of getting the title automatically through family birthright. \n\nThe title of [concept_monarch_character] will rotate among all $character_role_monarch_elective$ [Concept('concept_character', '$concept_characters$')] every few years under this [concept_government_type].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_absolute_monarchy_foreign_dynastic:0 "Absolute Monarchy (Foreign & Dynastic)"
    gov_absolute_monarchy_foreign_dynastic_desc:0 "This is a [concept_government_type] where the power rests completely with a hereditary [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] in his or her capacity as the [Concept('concept_ruler','$RULER_TITLE_KING$')] or [Concept('concept_ruler','$RULER_TITLE_QUEEN$')]'s representative in the country.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_absolute_monarchy_foreign:0 "Absolute Monarchy (Foreign)"
    gov_absolute_monarchy_foreign_desc:0 "This is a [concept_government_type] where the power rests completely with the [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] in his or her capacity as the [Concept('concept_ruler','$RULER_TITLE_KING$')] or [Concept('concept_ruler','$RULER_TITLE_QUEEN$')]'s representative in the country.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_semi_constitutional_monarchy_foreign:0 "Semi-Constitutional Monarchy (Foreign)"
    gov_semi_constitutional_monarchy_foreign_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] in his or her capacity as the [Concept('concept_ruler','$RULER_TITLE_KING$')] or [Concept('concept_ruler','$RULER_TITLE_QUEEN$')]'s representative in the country is the [concept_head_of_state], but [Concept('concept_votes','$concept_voting$')] and a constitution partially influences the [Concept('concept_law','$concept_laws$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_constitutional_monarchy_foreign:0 "Monarchie constitutionnelle"
    gov_constitutional_monarchy_foreign_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] en sa qualité de représentant du [Concept('concept_ruler','$RULER_TITLE_KING$')] ou de la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] dans le pays est à la fois le [concept_head_of_state] et le #y chef du gouvernement#!. Le [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] est élu par le peuple.\n\n$TRANSFER_OF_POWER_PRESIDENTIAL_ELECTIVE_NAME_DESC$"
    gov_constitutional_monarchy_dictatorship_dynastic:0 "Dictature monarchique constitutionnelle (dynastique)"
    gov_constitutional_monarchy_dictatorship_dynastic_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_KING$')] ou la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] est le [concept_head_of_state] mais le chef du gouvernement, le [Concept('concept_ruler','$RULER_TITLE_CHANCELLOR$')], est héréditaire et détient réellement le pouvoir dictatorial dans le pays.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_presidential_dictatorship_dynastic:0 "Dictature présidentielle (dynastique)"
    gov_presidential_dictatorship_dynastic_desc:0 "Il s'agit d'un [concept_government_type] où le [concept_country] est dirigé par un [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')] héréditaire exerçant des pouvoirs dictatoriaux.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_presidential_dictatorship_desc:0 "Il s'agit d'un [concept_government_type] où le [concept_country] est dirigé par un [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')] exerçant des pouvoirs dictatoriaux.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_presidential_democracy_desc:2 "Il s'agit d'un [concept_government_type] où le [concept_country] est dirigé par un [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')] [Concept('concept_election','$concept_elected$')].\n\n$TRANSFER_OF_POWER_PRESIDENTIAL_ELECTIVE_NAME_DESC$"
