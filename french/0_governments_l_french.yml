    gov_semi_constitutional_empire:0 "Semi-Constitutional Monarchy"
    gov_semi_constitutional_empire_desc:0 "Il s'agit d'un [concept_government_type] où l'[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] ou l'[Concept('concept_ruler','$RULER_TITLE_EMPRESS$')] est le [concept_head_of_state], mais la [Concept('concept_votes','$concept_voting$')] et la constitution influencent partiellement la [Concept('concept_law','$concept_laws$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_elective_monarchy:0 "Elective Monarchy"
    gov_elective_monarchy_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_KING$')] ou la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] est choisi par un vote au lieu d'obtenir le titre automatiquement par droit de naissance familial. \n\nLe titre de [concept_monarch_character] sera alterné parmi tous les [Concept('concept_character', '$concept_characters$')] $character_role_monarch_elective$ tous les quelques années sous ce [concept_government_type].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_absolute_monarchy_foreign_dynastic:0 "Monarchie Absolue (Dynastique et Étrangère)"
    gov_absolute_monarchy_foreign_dynastic_desc:0 "Il s'agit d'un [concept_government_type] où le pouvoir appartient entièrement à un [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] héréditaire en sa qualité de représentant du [Concept('concept_ruler','$RULER_TITLE_KING$')] ou de la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] dans le pays.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_absolute_monarchy_foreign:0 "Monarchie Absolue (Étrangère)"
    gov_absolute_monarchy_foreign_desc:0 "Il s'agit d'un [concept_government_type] où le pouvoir appartient entièrement au [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] en sa qualité de représentant du [Concept('concept_ruler','$RULER_TITLE_KING$')] ou de la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] dans le pays.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_semi_constitutional_monarchy_foreign:0 "Monarchie Semi-Constitutionnelle (Étrangère)"
    gov_semi_constitutional_monarchy_foreign_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] in his or her capacity as the [Concept('concept_ruler','$RULER_TITLE_KING$')] or [Concept('concept_ruler','$RULER_TITLE_QUEEN$')]'s representative in the country is the [concept_head_of_state], but [Concept('concept_votes','$concept_voting$')] and a constitution partially influences the [Concept('concept_law','$concept_laws$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_constitutional_monarchy_foreign:0 "Monarchie Constitutionnelle (Étrangère)"
    gov_constitutional_monarchy_foreign_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] en sa qualité de représentant du [Concept('concept_ruler','$RULER_TITLE_KING$')] ou de la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] dans le pays est à la fois le [concept_head_of_state] et le Chef du Gouvernement. Le [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] est élu par le peuple.\n\n$TRANSFER_OF_POWER_PRESIDENTIAL_ELECTIVE_NAME_DESC$"
    gov_constitutional_monarchy_dictatorship_dynastic:0 "Dictature Monarchie Constitutionnelle (Dynastique)"
    gov_constitutional_monarchy_dictatorship_dynastic_desc:0 "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_KING$')] or [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] is the [concept_head_of_state] but the Head of Government, the [Concept('concept_ruler','$RULER_TITLE_CHANCELLOR$')], is hereditary and actually holds dictatorial power in the country.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_presidential_dictatorship_dynastic:0 "Dictature Présidentielle (Dynastique)"
    gov_presidential_dictatorship_dynastic_desc:0 "This is a [concept_government_type] where the [concept_country] is ruled by a hereditary [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')] wielding dictatorial powers.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_presidential_dictatorship_desc:0 "This is a [concept_government_type] where the [concept_country] is ruled by a [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')] wielding dictatorial powers.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_presidential_democracy_desc:2 "This is a [concept_government_type] where the [concept_country] is ruled by an [Concept('concept_election','$concept_elected$')] [Concept('concept_ruler','$RULER_TITLE_PRESIDENT$')].\n\n$TRANSFER_OF_POWER_PRESIDENTIAL_ELECTIVE_NAME_DESC$"
    gov_nationalist_dictatorship_dynastic:0 "Dictature Nationaliste (Dynastique)"
