l_french:
    gov_mandate_administration_dictatorial:0 "Régime Mandataire"
    gov_mandate_administration_dictatorial_desc:0 "Il s'agit d'un [concept_government_type] dirigé par un [Concept('concept_ruler','$RULER_TITLE_GOVERNOR_GENERAL$')] nommé au nom de son suzerain.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    
    gov_absolute_empire:0 "Monarchie Absolue"
    gov_absolute_empire_desc:2 "Il s'agit d'un [concept_government_type] où le pouvoir appartient entièrement à l'[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')] ou à l'[Concept('concept_ruler','$RULER_TITLE_EMPRESS$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_absolute_monarchy:0 "Monarchie Absolue"
    gov_absolute_monarchy_desc:0 "Il s'agit d'un [concept_government_type] où le pouvoir appartient entièrement au [Concept('concept_ruler','$RULER_TITLE_KING$')] ou à la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_semi_constitutional_monarchy:0 "Monarchie Semi-Constitutionnelle"
    gov_semi_constitutional_monarchy_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_KING$')] ou [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] est le [concept_head_of_state], mais la [Concept('concept_votes','$concept_voting$')] et la constitution influencent partiellement la [Concept('concept_law','$concept_laws$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_constitutional_monarchy:0 "Monarchie Constitutionnelle"
    gov_constitutional_monarchy_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_KING$')] ou [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] est le [concept_head_of_state], mais la [Concept('concept_votes','$concept_voting$')] est la constitution dictent la [Concept('concept_law','$concept_laws$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    
    gov_constitutional_monarchy_dictatorship:0 "Dictature Monarchie Constitutionnelle"
    gov_constitutional_monarchy_dictatorship_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_KING$')] ou la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] est le [concept_head_of_state] sauf le Chef du Gouvernement, le [Concept('concept_ruler','$RULER_TITLE_CHANCELLOR$')], détient actuellement un pouvoir dictatorial dans le pays.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_constitutional_monarchy_regime:0 "Régime Monarchie Constitutionnelle"
    gov_constitutional_monarchy_regime_desc:0 "Il s'agit d'un [concept_government_type] où le [Concept('concept_ruler','$RULER_TITLE_KING$')] ou la [Concept('concept_ruler','$RULER_TITLE_QUEEN$')] est le [concept_head_of_state] sauf le Chef du Gouvernement, le [Concept('concept_ruler','$RULER_TITLE_CHANCELLOR$')], détient en fait tous les pouvoirs dans le pays.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
    
    gov_presidential_dictatorship:0 "Dictature Présidentielle"
    gov_presidential_regime:0 "Régime Présidentiel"
    gov_presidential_regime_desc:0 "Il s'agit d'un [concept_government_type] où le [concept_country] est dirigée par une classe politique riche et puissante. \n\n$TRANSFER_OF_POWER_NAME_DESC$"
    gov_presidential_democracy:0 "République Présidentielle"
